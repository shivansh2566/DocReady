<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocReady</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div>
      <h1 id="app-name">DocReady</h1>
      <p id="app-tagline">One visit. Everything ready.</p>
    </div>
    <button id="lang-toggle">తె</button>
  </header>

  <div class="container">

    <!-- Screen 1: Service Selection -->
    <div id="screen-home" class="screen active">
      <p class="screen-title" id="home-title">Select a Service</p>
      <p class="screen-sub" id="home-sub">What are you visiting the government office for?</p>
      <div id="service-list"></div>
    </div>

    <!-- Screen 2: Questions -->
    <div id="screen-question" class="screen">
      <button class="back-btn" id="q-back">← Back</button>
      <p class="step-indicator" id="q-step">Question 1 of 2</p>
      <div class="question-box">
        <p class="question-text" id="q-text"></p>
        <div id="q-options"></div>
      </div>
    </div>

    <!-- Screen 3: Checklist -->
    <div id="screen-checklist" class="screen">
      <button class="back-btn" id="cl-back">← Back</button>
      <p class="screen-title" id="cl-title">Your Document Checklist</p>
      <p class="screen-sub" id="cl-sub">Carry all of these documents when you visit</p>
      <div id="checklist-items"></div>
      <div class="actions">
        <button class="btn btn-whatsapp" id="cl-whatsapp">📤 Share on WhatsApp</button>
        <button class="btn btn-secondary" id="cl-print">🖨 Print</button>
      </div>
      <div class="actions" style="margin-top: 10px;">
        <button class="btn btn-secondary" id="cl-reset">Start Over</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
